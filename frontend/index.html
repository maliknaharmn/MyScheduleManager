<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0752CB" />
    <meta name="google-site-verification" content="lA8eMf-TnpUoUMN4jm3_-2j4k3BpfpFQcDjiqR3xPsM" />
    <script>try{const c=JSON.parse(decodeURIComponent(document.cookie.split(';').map(c=>c.trim()).find(c=>c.startsWith('myschedule_storage='))?.slice(19)||''));const theme=c.version===1&&c.preferences===true&&c.expiresAt>Date.now()&&document.cookie.split(';').some(c=>c.trim()==='myschedule_theme=dark')?'dark':'light';document.documentElement.dataset.theme=theme;document.documentElement.style.colorScheme=theme}catch{document.documentElement.dataset.theme='light';document.documentElement.style.colorScheme='light'}</script>
    <meta name="description" content="MySchedule Manager adalah aplikasi agenda dan catatan pribadi untuk mengatur jadwal, melihat kapasitas harian, dan mengelola checklist. Google hanya digunakan untuk masuk." />
    <link rel="canonical" href="https://myschedulemanager.netlify.app/" />
    <script>if(location.pathname==='/'){const p=document.createElement('link');p.rel='preload';p.as='image';p.type='image/avif';p.fetchPriority='high';const t=document.documentElement.dataset.theme==='dark'?'dark':'light';p.imageSrcset=`/previews/home-${t}-720.avif 720w, /previews/home-${t}-1200.avif 1200w`;p.imageSizes='(max-width: 760px) calc(100vw - 40px), (max-width: 1060px) calc(100vw - 64px), 636px';document.head.append(p)}</script>
    <meta name="apple-mobile-web-app-title" content="MySchedule" />
    <title>MySchedule Manager</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png?v=my-paper-1" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png?v=my-paper-1" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png?v=my-paper-1" />
    <link rel="manifest" href="/manifest.webmanifest?v=my-paper-1" />
  </head>
  <body>
    <div id="root"><!--public-homepage--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
