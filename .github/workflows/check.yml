name: Quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-ephemeral-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: ci-ephemeral-only
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.lock
          .venv/bin/python -m pip install --no-deps -e .
      - name: Provision isolated ephemeral databases
        working-directory: backend
        run: .venv/bin/python scripts/provision_local.py
      - name: Backend lint, schema, and tests
        working-directory: backend
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .
          .venv/bin/alembic upgrade head
          .venv/bin/alembic check
          .venv/bin/python -m pytest -q
          .venv/bin/python scripts/export_openapi.py
      - name: Frontend tests and production build
        working-directory: frontend
        run: |
          npm ci
          npm run api:types
          git diff --exit-code -- src/api/generated.ts ../backend/openapi.json
          npm test
          npm run build
      - name: Browser checks (not live Google tests)
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
