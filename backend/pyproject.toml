[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "myschedule-backend"
version = "0.1.0"
description = "Private scheduling API for MySchedule Manager"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi[standard]>=0.115,<1",
    "uvicorn>=0.34,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.30,<1",
    "alembic>=1.15,<2",
    "pydantic-settings>=2.8,<3",
    "authlib>=1.6,<2",
    "httpx>=0.28,<1",
    "httpx2>=2.15,<3",
    "google-auth[requests]>=2.40,<3",
    "cryptography>=45,<50",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.11,<1",
    "pip-tools>=7.4,<8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/myschedule"]

[tool.fastapi]
entrypoint = "myschedule.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["database: requires the dedicated PostgreSQL test database"]
filterwarnings = ["error"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]
